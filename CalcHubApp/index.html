<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CalcHubApp — Professional calculation hub: NIK PSM/Vault sizing, unit converters, score cards, loan EMI, date/age and time tools.">
  <meta name="theme-color" content="#d4ff3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcHub">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>CalcHubApp</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   CalcHubApp — Design System
   Warm-black · Lime-accent · Instrument Panel
   ═══════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0c0b09;
  --bg-deep:      #080807;
  --surface:      #14130f;
  --surface-2:    #1c1a14;
  --border:       #2a2820;
  --border-light: #38352a;
  --lime:         #d4ff3a;
  --lime-dim:     rgba(212,255,58,.12);
  --lime-border:  rgba(212,255,58,.3);
  --text:         #e8e4d8;
  --text-muted:   #6b6656;
  --text-dim:     #3d3a2f;

  /* Module accents */
  --blue:   #0096ff;
  --amber:  #f59e0b;
  --orange: #f97316;
  --green:  #34d399;
  --purple: #c084fc;
  --sky:    #38bdf8;
  --pink:   #fb7185;

  --font-head: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
  --shadow:    0 2px 20px rgba(0,0,0,.5);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
}

/* ── Layout ── */
.app-wrap {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ── Sidebar (desktop) ── */
.sidebar {
  width: 220px;
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 1.25rem 1.1rem 1rem;
  border-bottom: 1px solid var(--border);
}

.logo-mark {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 15px;
  color: var(--lime);
  letter-spacing: .06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-bracket {
  color: var(--text-muted);
  font-weight: 400;
}

.logo-sub {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-top: 3px;
}

.sidebar-nav {
  flex: 1;
  padding: 10px 8px;
}

.nav-section-label {
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 8px 8px 4px;
  margin-top: 4px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .18s;
  text-align: left;
  letter-spacing: .02em;
}

.nav-btn:hover {
  background: rgba(255,255,255,.04);
  color: var(--text);
}

.nav-btn.active {
  background: var(--lime-dim);
  color: var(--lime);
  border: 1px solid var(--lime-border);
}

.nav-btn .nav-icon { font-size: 15px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-btn .nav-desc { font-size: 9px; color: var(--text-dim); display: block; margin-top: 1px; }

.sidebar-footer {
  padding: 12px 8px;
  border-top: 1px solid var(--border);
}

/* ── Main content area ── */
.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12,11,9,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}

.hamburger span {
  display: block;
  width: 20px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all .2s;
}

.topbar-title {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--lime);
  letter-spacing: .05em;
}

.topbar-module {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: .04em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Banner ── */
.banner-wrap {
  position: relative;
  height: 160px;
  overflow: hidden;
  flex-shrink: 0;
}

.banner-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.banner-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(12,11,9,0) 0%, rgba(12,11,9,.7) 100%);
}

.banner-change-btn {
  position: absolute;
  bottom: 10px;
  right: 12px;
  background: rgba(12,11,9,.7);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 5px 10px;
  cursor: pointer;
  letter-spacing: .06em;
  backdrop-filter: blur(8px);
  transition: all .2s;
}

.banner-change-btn:hover { color: var(--text); border-color: var(--lime); }

.banner-placeholder {
  height: 160px;
  background: linear-gradient(135deg, var(--surface) 0%, var(--bg-deep) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.banner-placeholder::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
    repeating-linear-gradient(0deg,  transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
  opacity: .4;
}

.banner-placeholder-text {
  font-family: var(--font-head);
  font-size: 2.5rem;
  color: var(--lime);
  letter-spacing: -.02em;
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 20px rgba(212,255,58,.4);
}

/* ── Content scroll area ── */
.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

/* ── Module container ── */
.mod-container {
  max-width: 720px;
  margin: 0 auto;
}

/* ── Module header ── */
.mod-header { margin-bottom: 1.5rem; }

.mod-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid;
  margin-bottom: 8px;
}

.mod-title {
  font-family: var(--font-head);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -.01em;
  margin-bottom: 6px;
}

.mod-desc {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .02em;
  line-height: 1.5;
}

/* ── Calc grid ── */
.calc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 1rem;
}

/* ── Field card ── */
.field-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
}

.field-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.field-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.field-input {
  flex: 1;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 500;
  padding: 8px 10px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -moz-appearance: textfield;
  width: 100%;
}

.field-input::-webkit-outer-spin-button,
.field-input::-webkit-inner-spin-button { -webkit-appearance: none; }

.field-input:focus {
  border-color: var(--lime);
  box-shadow: 0 0 0 3px rgba(212,255,58,.08);
}

input[type="date"].field-input,
input[type="month"].field-input {
  color-scheme: dark;
}

.field-select {
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  cursor: pointer;
  width: 100%;
}

.field-select:focus { border-color: var(--lime); }

.field-unit {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  padding: 0 2px;
  flex-shrink: 0;
}

.field-prefix {
  font-size: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.field-hint {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: .02em;
  line-height: 1.4;
}

/* ── Buttons ── */
.calc-btn {
  display: block;
  width: 100%;
  padding: 13px 20px;
  border: 1px solid;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 1rem;
}

.calc-btn.lime   { background: var(--lime-dim); color: var(--lime); border-color: var(--lime-border); }
.calc-btn.blue   { background: rgba(0,150,255,.1); color: var(--blue); border-color: rgba(0,150,255,.3); }
.calc-btn.green  { background: rgba(52,211,153,.1); color: var(--green); border-color: rgba(52,211,153,.3); }
.calc-btn.orange { background: rgba(249,115,22,.1); color: var(--orange); border-color: rgba(249,115,22,.3); }

.calc-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.calc-btn:active { transform: translateY(0); }

.calc-btn-sm {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 7px 14px;
  cursor: pointer;
  letter-spacing: .06em;
  transition: all .2s;
}

.calc-btn-sm:hover { color: var(--text); border-color: var(--text-muted); }
.calc-btn-sm.blue  { color: var(--blue);   border-color: rgba(0,150,255,.3); background: rgba(0,150,255,.06); }
.calc-btn-sm.red   { color: #f87171;       border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.06); }
.calc-btn-sm.orange { color: var(--orange); border-color: rgba(249,115,22,.3); background: rgba(249,115,22,.06); }
.calc-btn-sm.green { color: var(--green);  border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.06); }

/* ── Results panel ── */
.results-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-top: 4px;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 8px;
  margin-bottom: 1rem;
}

.res-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.res-box.hi      { border-color: var(--lime);   background: var(--lime-dim); }
.res-box.hi-blue { border-color: var(--blue);   background: rgba(0,150,255,.08); }
.res-box.hi-green{ border-color: var(--green);  background: rgba(52,211,153,.08); }
.res-box.hi-orange { border-color: var(--orange); background: rgba(249,115,22,.08); }
.res-box.wide    { grid-column: 1 / -1; }

.res-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.res-value {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  word-break: break-all;
}

.res-box.hi .res-value       { color: var(--lime);   }
.res-box.hi-blue .res-value  { color: var(--blue);   }
.res-box.hi-green .res-value { color: var(--green);  }
.res-box.hi-orange .res-value{ color: var(--orange); }

.res-hint {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
  line-height: 1.3;
}

.results-note {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.6;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 4px;
}

/* ── Tables ── */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }

.ref-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.ref-table th {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 8px 10px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: left;
  white-space: nowrap;
}

.ref-table td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  color: var(--text);
  white-space: nowrap;
}

.ref-table tr:hover td { background: rgba(255,255,255,.02); }
.ref-table tfoot td { background: var(--surface-2); }

.mono { font-family: var(--font-mono); }

/* ── Unit Converter grid ── */
.uc-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 1rem;
}

.uc-res-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  cursor: default;
  transition: border-color .2s;
}

.uc-active        { border-color: var(--amber);  background: rgba(245,158,11,.08); }
.uc-active-purple { border-color: var(--purple); background: rgba(192,132,252,.08); }
.uc-active .res-value        { color: var(--amber);  }
.uc-active-purple .res-value { color: var(--purple); }

/* ── Bandwidth result ── */
.bw-result-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  text-align: center;
}

.bw-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.bw-value { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 600; color: var(--amber); }
.bw-sub   { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* ── Score Card specifics ── */
.sc-info-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}

.sc-info-field label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.sc-info-field input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 7px 9px;
  outline: none;
  transition: border-color .2s;
}

.sc-info-field input:focus { border-color: var(--sky); }

.sc-subj-row { margin-bottom: 8px; padding: 12px 14px 8px; }

.sc-subj-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.sc-bar-wrap {
  background: rgba(255,255,255,.05);
  border-radius: 99px;
  height: 4px;
  overflow: hidden;
}

.sc-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .4s ease, background .3s;
  width: 0;
}

.sc-report-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 4px;
}

.sc-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid;
}

.sc-student-name { font-family: var(--font-head); font-size: 1.4rem; margin-bottom: 3px; }
.sc-meta { font-size: 11px; color: var(--text-muted); }

.sc-overall { text-align: right; font-family: var(--font-mono); }
.sc-grade-big { font-size: 2rem; font-weight: 700; line-height: 1; }
.sc-pct-big   { font-size: 1.5rem; font-weight: 600; }
.sc-label-small { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.grade-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 4px;
}

.sc-gap-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
}

.gap-row { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.gap-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.gap-subj { font-weight: 600; margin-bottom: 5px; }
.gap-pct  { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
.gap-chips-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }

.gap-chip {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: .04em;
}

.gap-chip.red    { background: rgba(248,113,113,.1); color: #f87171; border: 1px solid rgba(248,113,113,.25); }
.gap-chip.green  { background: rgba(52,211,153,.1);  color: #34d399; border: 1px solid rgba(52,211,153,.25); }
.gap-chip.amber  { background: rgba(251,191,36,.1);  color: #fbbf24; border: 1px solid rgba(251,191,36,.25); }
.gap-chip.blue   { background: rgba(96,165,250,.1);  color: #93c5fd; border: 1px solid rgba(96,165,250,.25); }

/* ── Sub-tabs (Date/Age) ── */
.sub-tabs-row {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.sub-tab {
  flex: 1;
  min-width: 70px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .18s;
  text-align: center;
  letter-spacing: .04em;
}

.sub-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
.sub-tab.active-green { background: rgba(52,211,153,.1); color: var(--green); border: 1px solid rgba(52,211,153,.3); }

.dt-panel { display: block; }

/* ── Milestones ── */
.milestone-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}

.milestone-age   { font-weight: 600; color: var(--green); min-width: 45px; }
.milestone-date  { flex: 1; color: var(--text); }
.milestone-status { font-size: 11px; }
.milestone-status.past   { color: var(--text-muted); }
.milestone-status.future { color: var(--green); }

/* ── EMI Donut ── */
.emi-donut-wrap {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 1rem 0 0.5rem;
}

.emi-donut {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: conic-gradient(var(--orange) 0%, rgba(249,115,22,.2) 0%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.emi-donut-hole {
  width: 72px;
  height: 72px;
  background: var(--surface);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.emi-donut-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; }
.emi-donut-val   { font-size: 11px; font-weight: 700; color: var(--text); }

.emi-legend { display: flex; flex-direction: column; gap: 8px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
.legend-dot  { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

/* ── Time Converter ── */
.tc-grid { margin-bottom: 1rem; }

.clock-display {
  background: rgba(192,132,252,.06);
  border: 1px solid rgba(192,132,252,.2);
  border-radius: var(--radius-lg);
  padding: 1.1rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 1rem;
}

.clock-time {
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: .04em;
  line-height: 1;
}

.clock-date {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.clock-info { text-align: right; }

.world-clock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
}

.world-clock-box {
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  text-align: center;
}

.wc-name { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.wc-time { font-size: 1.1rem; font-weight: 700; color: var(--purple); font-family: var(--font-mono); margin-bottom: 3px; }
.wc-tz   { font-size: 9px; color: var(--text-dim); }

/* ── Settings panel ── */
.settings-wrap { max-width: 600px; margin: 0 auto; }

.settings-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 1rem;
}

.settings-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--lime);
  border-left: 3px solid var(--lime);
  padding-left: 8px;
  margin-bottom: 14px;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}

.settings-row:last-child { border-bottom: none; }

.settings-row-info { flex: 1; }
.settings-row-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.settings-row-desc  { font-size: 11px; color: var(--text-muted); }

.install-btn {
  background: var(--lime-dim);
  border: 1px solid var(--lime-border);
  color: var(--lime);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .2s;
}

.install-btn:hover { filter: brightness(1.15); }
.install-btn:disabled { opacity: .5; cursor: not-allowed; }

.version-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 4px;
  background: rgba(212,255,58,.08);
  color: var(--lime);
  border: 1px solid var(--lime-border);
}

/* ── Profile ── */
.profile-avatar-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 2px solid var(--lime-border);
  object-fit: cover;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  overflow: hidden;
}

.profile-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* ── Toast notification ── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--surface-2);
  border: 1px solid var(--lime-border);
  color: var(--lime);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 10px 16px;
  border-radius: var(--radius);
  pointer-events: auto;
  animation: toastIn .25s ease;
  letter-spacing: .04em;
  max-width: 280px;
}

@keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ── Mobile nav overlay ── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 300;
  backdrop-filter: blur(2px);
}

/* ── Corner brackets (instrument-panel aesthetic) ── */
.bracket-card {
  position: relative;
  padding: 16px;
}

.bracket-card::before, .bracket-card::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-color: var(--lime);
  border-style: solid;
}

.bracket-card::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
.bracket-card::after  { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ════════════════════════════════
   RESPONSIVE — Mobile First
   ════════════════════════════════ */

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: -240px;
    top: 0;
    z-index: 400;
    width: 240px;
    transition: left .25s ease;
    height: 100vh;
    height: 100dvh;
  }

  .sidebar.open { left: 0; }
  .sidebar-overlay { display: block; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

  .hamburger { display: flex; }

  .calc-grid { grid-template-columns: 1fr 1fr; }
  .results-grid { grid-template-columns: 1fr 1fr; }
  .uc-results-grid { grid-template-columns: repeat(3, 1fr); }
  .world-clock-grid { grid-template-columns: repeat(3, 1fr); }

  .content-scroll { padding: 1rem; }

  .banner-wrap, .banner-placeholder { height: 110px; }
  .banner-placeholder-text { font-size: 1.75rem; }
}

@media (max-width: 480px) {
  .calc-grid { grid-template-columns: 1fr; }
  .results-grid { grid-template-columns: 1fr 1fr; }
  .uc-results-grid { grid-template-columns: 1fr 1fr; }
  .world-clock-grid { grid-template-columns: 1fr 1fr; }
  .sc-info-bar { grid-template-columns: 1fr 1fr; }
  .clock-time { font-size: 1.6rem; }
}

/* ── Ruler ticks (decorative) ── */
.ruler-ticks {
  height: 16px;
  background: repeating-linear-gradient(
    90deg,
    transparent, transparent 9px,
    var(--border) 9px, var(--border) 10px
  );
  margin-bottom: 1.5rem;
  position: relative;
}

.ruler-ticks::after {
  content: attr(data-label);
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: .1em;
}
</style>
</head>

<body>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- App wrap -->
<div class="app-wrap">

  <!-- ════ SIDEBAR ════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <span class="logo-bracket">[</span>CalcHub<span class="logo-bracket">]</span>
      </div>
      <div class="logo-sub">v1.0.0 · Professional Suite</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">NIK Tools</div>
      <button class="nav-btn active" data-module="psm" id="nav-psm">
        <span class="nav-icon">🖥️</span>
        <span>
          PSM Server
          <span class="nav-desc">Storage Sizing</span>
        </span>
      </button>
      <button class="nav-btn" data-module="vault" id="nav-vault">
        <span class="nav-icon">🔐</span>
        <span>
          Vault Server
          <span class="nav-desc">Storage Sizing</span>
        </span>
      </button>

      <div class="nav-section-label">Converters</div>
      <button class="nav-btn" data-module="unit-converter" id="nav-unit-converter">
        <span class="nav-icon">⚖️</span>
        <span>
          Unit Converter
          <span class="nav-desc">Storage · Bandwidth</span>
        </span>
      </button>
      <button class="nav-btn" data-module="time-converter" id="nav-time-converter">
        <span class="nav-icon">⏱️</span>
        <span>
          Time
          <span class="nav-desc">Units · Timezones</span>
        </span>
      </button>

      <div class="nav-section-label">Personal</div>
      <button class="nav-btn" data-module="scorecard" id="nav-scorecard">
        <span class="nav-icon">🎓</span>
        <span>
          Score Card
          <span class="nav-desc">Student Report</span>
        </span>
      </button>
      <button class="nav-btn" data-module="loan-emi" id="nav-loan-emi">
        <span class="nav-icon">💰</span>
        <span>
          Loan EMI
          <span class="nav-desc">Personal Loan</span>
        </span>
      </button>
      <button class="nav-btn" data-module="date-age" id="nav-date-age">
        <span class="nav-icon">📅</span>
        <span>
          Date / Age
          <span class="nav-desc">Date Calculations</span>
        </span>
      </button>

      <div class="nav-section-label">App</div>
      <button class="nav-btn" data-module="settings" id="nav-settings">
        <span class="nav-icon">⚙️</span>
        <span>
          Settings
          <span class="nav-desc">Install · Profile · Export</span>
        </span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div style="font-size:9px;color:var(--text-dim);letter-spacing:.1em">
        CALCHUBAPP · OFFLINE-READY PWA
      </div>
    </div>
  </aside>

  <!-- ════ MAIN AREA ════ -->
  <div class="main-area">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <div class="topbar-title">CalcHubApp</div>
          <div class="topbar-module" id="topbar-module">PSM Server · Storage Sizing</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div id="pwa-status-dot" style="width:7px;height:7px;border-radius:50%;background:var(--text-dim)" title="PWA Status"></div>
      </div>
    </header>

    <!-- Banner -->
    <div id="banner-section">
      <div class="banner-placeholder">
        <div class="banner-placeholder-text">CalcHub</div>
        <button class="banner-change-btn" id="banner-change-btn" style="position:absolute;bottom:10px;right:12px">
          📷 Add Banner
        </button>
      </div>
      <input type="file" id="banner-file-input" accept="image/*" style="display:none">
    </div>

    <!-- Module content -->
    <div class="content-scroll" id="content-scroll">
      <div class="ruler-ticks" data-label="CALCHUBv1.0"></div>
      <div class="mod-container" id="mod-container">
        <!-- Module content injected here -->
        <div style="color:var(--text-muted);text-align:center;padding:3rem">Loading modules…</div>
      </div>
    </div>

  </div>
</div>

<!-- ════ SCRIPTS ════ -->
<script type="module">
/* ─── Imports ─── */
import { MODULES, getModule } from './modules/registry.js';
import { Settings, History, Profile, exportAllData, importAllData, openDB } from './modules/storage.js';

/* ─── App State ─── */
let activeModuleId  = 'psm';
let activeModule    = null;
let deferredInstall = null;
let profileData     = { name: 'User', avatar: null };

/* ─── Version ─── */
const APP_VERSION = '1.0.0';

/* ─── PWA: Capture install prompt ─── */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById('pwa-status-dot')?.setAttribute('style',
    'width:7px;height:7px;border-radius:50%;background:var(--lime);cursor:pointer;animation:pulse 2s infinite');
  showToast('App ready to install — go to Settings!');
});

window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  showToast('✓ CalcHubApp installed successfully!');
  document.getElementById('pwa-status-dot')?.setAttribute('style',
    'width:7px;height:7px;border-radius:50%;background:var(--green)');
});

/* ─── Service Worker registration ─── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => { console.log('[CalcHub] SW registered', reg.scope); })
      .catch(err => { console.warn('[CalcHub] SW failed:', err); });
  });
}

/* ─── Module loading ─── */
async function loadModule(id) {
  const mod = getModule(id);
  if (!mod) return;

  // Cleanup old module
  if (activeModule?.cleanup) activeModule.cleanup();
  activeModule   = mod;
  activeModuleId = id;

  // Update nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-module="${id}"]`)?.classList.add('active');

  // Update topbar
  document.getElementById('topbar-module').textContent = `${mod.label} · ${mod.desc}`;

  // Render
  const container = document.getElementById('mod-container');
  container.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:2rem">⟳ Loading…</div>`;

  await new Promise(r => setTimeout(r, 30)); // micro-yield for paint

  container.innerHTML = mod.render();
  mod.init();

  // Scroll to top
  document.getElementById('content-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });

  // Persist last-used module
  await Settings.set('lastModule', id);
}

/* ─── Settings module renderer (inline, not in modules/registry) ─── */
function renderSettings() {
  const container = document.getElementById('mod-container');
  const installed = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;

  container.innerHTML = `
  <div class="settings-wrap">
    <div class="mod-header">
      <span class="mod-badge" style="color:var(--lime);background:var(--lime-dim);border-color:var(--lime-border)">APP · SETTINGS</span>
      <h2 class="mod-title" style="color:var(--lime)">Settings</h2>
      <p class="mod-desc">Manage your CalcHubApp installation, profile, and data.</p>
    </div>

    <!-- Profile -->
    <div class="settings-section">
      <div class="settings-section-title">Profile</div>
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="settings-avatar" title="Click to change photo">
          <span id="avatar-placeholder">👤</span>
        </div>
        <div>
          <input id="profile-name" type="text" class="field-input" value="${profileData.name}" placeholder="Your name" style="width:200px;margin-bottom:6px">
          <div style="font-size:11px;color:var(--text-muted)">Click avatar to upload a photo (shrinks automatically)</div>
          <input type="file" id="avatar-file" accept="image/*" style="display:none">
        </div>
      </div>
      <button class="calc-btn lime" style="max-width:200px" id="save-profile-btn">SAVE PROFILE</button>
    </div>

    <!-- Install -->
    <div class="settings-section">
      <div class="settings-section-title">PWA Install</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Install as App</div>
          <div class="settings-row-desc">Add CalcHubApp to your home screen for offline access. Works on Android Chrome, Edge, and desktop browsers.</div>
        </div>
        <button class="install-btn" id="install-btn" ${!deferredInstall && !installed ? 'disabled' : ''}>
          ${installed ? '✓ INSTALLED' : deferredInstall ? '⬇ INSTALL' : 'NOT AVAILABLE'}
        </button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Offline Status</div>
          <div class="settings-row-desc">Service worker caches all modules for offline use.</div>
        </div>
        <span class="version-tag" id="sw-status">Checking…</span>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">App Version</div>
          <div class="settings-row-desc">CalcHubApp — Semantic versioning (MAJOR.MINOR.PATCH)</div>
        </div>
        <span class="version-tag">v${APP_VERSION}</span>
      </div>
    </div>

    <!-- Banner -->
    <div class="settings-section">
      <div class="settings-section-title">Banner Image</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Top Banner</div>
          <div class="settings-row-desc">Add any image — it shrinks vertically to fit the banner area. Supports portrait / landscape photos.</div>
        </div>
        <button class="calc-btn-sm" id="change-banner-settings">📷 Change</button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Remove Banner</div>
          <div class="settings-row-desc">Reset to the default CalcHub graphic.</div>
        </div>
        <button class="calc-btn-sm red" id="remove-banner-btn">Remove</button>
      </div>
    </div>

    <!-- Export / Import -->
    <div class="settings-section">
      <div class="settings-section-title">Export / Import Data</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Export All Data</div>
          <div class="settings-row-desc">Download all settings, history, and profile as a JSON backup file.</div>
        </div>
        <button class="calc-btn-sm orange" id="export-btn">⬇ Export</button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Import Data</div>
          <div class="settings-row-desc">Restore from a previously exported CalcHubApp JSON backup.</div>
        </div>
        <button class="calc-btn-sm blue" id="import-btn">⬆ Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
    </div>

    <!-- Danger -->
    <div class="settings-section" style="border-color:rgba(248,113,113,.2)">
      <div class="settings-section-title" style="color:#f87171;border-left-color:#f87171">Danger Zone</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Clear All Data</div>
          <div class="settings-row-desc">Permanently removes all stored settings, history, and profile.</div>
        </div>
        <button class="calc-btn-sm red" id="clear-all-btn">🗑 Clear</button>
      </div>
    </div>
  </div>
  `;

  // Show SW status
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      const el = document.getElementById('sw-status');
      if (el) el.textContent = regs.length ? '✓ Cached' : 'Pending';
    });
  }

  // Avatar display
  if (profileData.avatar) {
    const ph = document.getElementById('avatar-placeholder');
    if (ph) ph.innerHTML = `<img src="${profileData.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  }

  // Avatar upload
  const avatarDiv = document.getElementById('settings-avatar');
  const avatarFile = document.getElementById('avatar-file');
  avatarDiv?.addEventListener('click', () => avatarFile?.click());
  avatarFile?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      profileData.avatar = ev.target.result;
      const ph = document.getElementById('avatar-placeholder');
      if (ph) ph.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    };
    reader.readAsDataURL(file);
  });

  // Save profile
  document.getElementById('save-profile-btn')?.addEventListener('click', async () => {
    profileData.name = document.getElementById('profile-name')?.value || 'User';
    await Profile.save(profileData);
    showToast('✓ Profile saved');
  });

  // Install
  document.getElementById('install-btn')?.addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    const { outcome } = await deferredInstall.userChoice;
    if (outcome === 'accepted') { deferredInstall = null; showToast('✓ Installing…'); }
  });

  // Banner buttons
  document.getElementById('change-banner-settings')?.addEventListener('click', () => {
    document.getElementById('banner-file-input')?.click();
  });
  document.getElementById('remove-banner-btn')?.addEventListener('click', async () => {
    await Settings.set('bannerImage', null);
    renderBanner(null);
    showToast('Banner removed');
  });

  // Export
  document.getElementById('export-btn')?.addEventListener('click', async () => {
    const json = await exportAllData();
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), {
      href: url,
      download: `calchubapp-backup-${Date.now()}.json`
    });
    a.click();
    URL.revokeObjectURL(url);
    showToast('✓ Data exported');
  });

  // Import
  const importFile = document.getElementById('import-file');
  document.getElementById('import-btn')?.addEventListener('click', () => importFile?.click());
  importFile?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        await importAllData(ev.target.result);
        showToast('✓ Data imported — reload to apply');
      } catch {
        showToast('✗ Import failed — invalid file');
      }
    };
    reader.readAsText(file);
  });

  // Clear all
  document.getElementById('clear-all-btn')?.addEventListener('click', async () => {
    if (!confirm('Clear ALL CalcHubApp data? This cannot be undone.')) return;
    ['settings','history','profiles','exports'].forEach(s => {
      try { localStorage.removeItem(s); } catch {}
    });
    indexedDB.deleteDatabase('CalcHubApp');
    showToast('✓ All data cleared — reloading…');
    setTimeout(() => location.reload(), 1500);
  });
}

/* ─── Banner handling ─── */
function renderBanner(dataUrl) {
  const section = document.getElementById('banner-section');
  if (!section) return;
  if (dataUrl) {
    section.innerHTML = `
      <div class="banner-wrap">
        <img class="banner-img" src="${dataUrl}" alt="Banner">
        <div class="banner-overlay"></div>
        <button class="banner-change-btn" id="banner-change-btn">📷 Change</button>
      </div>
      <input type="file" id="banner-file-input" accept="image/*" style="display:none">
    `;
  } else {
    section.innerHTML = `
      <div class="banner-placeholder">
        <div class="banner-placeholder-text">CalcHub</div>
        <button class="banner-change-btn" id="banner-change-btn" style="position:absolute;bottom:10px;right:12px">📷 Add Banner</button>
      </div>
      <input type="file" id="banner-file-input" accept="image/*" style="display:none">
    `;
  }
  attachBannerEvents();
}

function attachBannerEvents() {
  document.getElementById('banner-change-btn')?.addEventListener('click', () => {
    document.getElementById('banner-file-input')?.click();
  });
  document.getElementById('banner-file-input')?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      const dataUrl = ev.target.result;
      await Settings.set('bannerImage', dataUrl);
      renderBanner(dataUrl);
      showToast('✓ Banner updated');
    };
    reader.readAsDataURL(file);
  });
}

/* ─── Toast ─── */
function showToast(msg, dur = 3000) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, dur);
}

/* ─── Sidebar toggle (mobile) ─── */
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const ov  = document.getElementById('sidebar-overlay');
  const open = sb.classList.toggle('open');
  ov.classList.toggle('show', open);
}

document.getElementById('hamburger')?.addEventListener('click', toggleSidebar);
document.getElementById('sidebar-overlay')?.addEventListener('click', toggleSidebar);

/* ─── Nav clicks ─── */
document.querySelectorAll('.nav-btn[data-module]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const id = btn.dataset.module;
    if (window.innerWidth <= 768) toggleSidebar();
    if (id === 'settings') {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('topbar-module').textContent = 'Settings';
      if (activeModule?.cleanup) activeModule.cleanup();
      activeModule = null;
      renderSettings();
    } else {
      await loadModule(id);
    }
  });
});

/* ─── Startup ─── */
async function startup() {
  await openDB();

  // Load profile
  const saved = await Profile.load();
  if (saved) profileData = { ...profileData, ...saved };

  // Restore banner
  const bannerUrl = await Settings.get('bannerImage');
  renderBanner(bannerUrl);

  // Load last module (default: psm)
  const lastMod = await Settings.get('lastModule', 'psm');
  await loadModule(lastMod);

  // PWA pulse animation style
  const style = document.createElement('style');
  style.textContent = `
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:.4; }
    }
  `;
  document.head.appendChild(style);
}

startup().catch(console.error);
</script>
