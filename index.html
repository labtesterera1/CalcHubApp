<script>
// Runs synchronously before module loads
// Clears stale service worker caches on version mismatch
(function() {
  const APP_V = '3.0';
  const stored = localStorage.getItem('calchub_app_version');
  if (stored !== APP_V) {
    localStorage.setItem('calchub_app_version', APP_V);
    // Unregister all old service workers so fresh files load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
        // Clear all caches
        if (window.caches) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
        console.log('[CalcHub] Stale SW cleared for v' + APP_V);
      });
    }
  }
})();
</script>

<script type="module">
/* ─── Imports ─── */
import { MODULES, getModule } from './modules/registry.js';
import { Settings, Profile, Banner, ScorecardStore, exportAllData, importAllData, openDB, requestPersistence, checkPersistence, getStorageEstimate } from './modules/storage.js';

/* ─── App State ─── */
let activeModuleId  = 'psm';
let activeModule    = null;
let deferredInstall = null;
let profileData     = { name: 'User', avatar: null };
let onHomeScreen    = false;

/* ─── Go Home ─── */
window.__goHome = function() {
  showHomeScreen();
};

/* ─── Update topbar avatar ─── */
function updateTopbarAvatar() {
  const el = document.getElementById('topbar-avatar');
  const nameEl = document.getElementById('topbar-app-name');
  if (!el) return;
  if (profileData.avatar) {
    el.innerHTML = `<img src="${profileData.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  } else {
    el.innerHTML = profileData.name ? profileData.name[0].toUpperCase() : '👤';
  }
  if (nameEl && profileData.name) nameEl.textContent = profileData.name || 'CalcHubApp';
}

/* ─── Version ─── */
const APP_VERSION = '1.0.0';

/* ─── PWA: Capture install prompt ─── */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById('pwa-status-dot')?.setAttribute('style',
    'width:7px;height:7px;border-radius:50%;background:var(--lime);cursor:pointer;animation:pulse 2s infinite');
  showToast('App ready to install — go to Settings!');
});

window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  showToast('✓ CalcHubApp installed successfully!');
  document.getElementById('pwa-status-dot')?.setAttribute('style',
    'width:7px;height:7px;border-radius:50%;background:var(--green)');
});

/* ─── Service Worker registration ─── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('[CalcHub] SW registered', reg.scope);
        // Detect SW update and notify user
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker?.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showToast('↑ Update available — tap to refresh', 6000);
              // Auto-apply after 6s
              setTimeout(() => { newWorker.postMessage('SKIP_WAITING'); location.reload(); }, 6000);
            }
          });
        });
      })
      .catch(err => { console.warn('[CalcHub] SW failed:', err); });

    // When SW takes control, reload once for fresh cache
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; }
    });
  });
}

/* ─── Home Screen ─── */
function showHomeScreen() {
  onHomeScreen = true;

  // Cleanup active module
  if (activeModule?.cleanup) activeModule.cleanup();
  activeModule = null;

  // Hide module container, show home
  const hs  = document.getElementById('home-screen');
  const mc  = document.getElementById('mod-container');
  const rt  = document.getElementById('ruler-ticks-el');
  if (hs)  { hs.style.display = 'block'; }
  if (mc)  { mc.style.display = 'none'; }
  if (rt)  { rt.style.display = 'none'; }

  // Hide back button
  document.getElementById('home-btn')?.classList.remove('visible');

  // Remove module-active class from main area
  document.querySelector('.main-area')?.classList.remove('module-active');

  // Clear nav active, mark Home as active
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home')?.classList.add('active');

  // Update greeting name
  const gn = document.getElementById('home-greeting-name');
  if (gn) gn.textContent = (profileData.name && profileData.name !== 'User')
    ? `Hello, ${profileData.name} 👋`
    : 'Hello 👋';

  // Persist
  Settings.set('lastModule', '__home__').catch(() => {});

  // Scroll to top
  document.getElementById('content-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  }
}

/* ─── Build Home Grid ─── */
function buildHomeGrid() {
  const grid = document.getElementById('home-grid');
  if (!grid) return;

  const MODULE_META = [
    { id:'psm',           icon:'🖥️',  name:'PSM Server',    desc:'Storage Sizing',    accent:'#d4ff3a' },
    { id:'vault',         icon:'🔐',  name:'Vault Server',  desc:'Storage Sizing',    accent:'#0096ff' },
    { id:'unit-converter',icon:'⚖️',  name:'Unit Conv.',    desc:'Storage Units',     accent:'#f59e0b' },
    { id:'scorecard',     icon:'🎓',  name:'Score Card',    desc:'Student Report',    accent:'#38bdf8' },
    { id:'loan-emi',      icon:'💰',  name:'Loan EMI',      desc:'Personal Loan',     accent:'#f97316' },
    { id:'date-age',      icon:'📅',  name:'Date & Age',    desc:'Date Calculations', accent:'#34d399' },
    { id:'time-converter',icon:'⏱️',  name:'Time Conv.',    desc:'Time Zones',        accent:'#c084fc' },
    { id:'settings',      icon:'⚙️',  name:'Settings',      desc:'Install · Profile', accent:'#6b6656', wide:true },
  ];

  grid.innerHTML = MODULE_META.map(m => `
    <div class="home-card ${m.wide?'settings-card':''}"
         style="--card-accent:${m.accent};border-color:rgba(${hexToRgb(m.accent)},.18);"
         onclick="__homeNav('${m.id}')"
         onmouseenter="this.style.borderColor='rgba(${hexToRgb(m.accent)},.45)'"
         onmouseleave="this.style.borderColor='rgba(${hexToRgb(m.accent)},.18)'">
      <div class="home-card-dot" style="background:${m.accent};box-shadow:0 0 6px ${m.accent}88;"></div>
      <div class="home-card-icon">${m.icon}</div>
      <div>
        <div class="home-card-name" style="color:${m.accent}">${m.name}</div>
        <div class="home-card-desc">${m.desc}</div>
      </div>
    </div>
  `).join('');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

window.__homeNav = function(id) {
  if (id === 'settings') {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-module="settings"]')?.classList.add('active');
    if (activeModule?.cleanup) activeModule.cleanup();
    activeModule = null;
    _showModuleArea();
    renderSettings();
  } else {
    loadModule(id);
  }
  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  }
};

function _showModuleArea() {
  onHomeScreen = false;
  document.getElementById('home-screen').style.display  = 'none';
  document.getElementById('mod-container').style.display = 'block';
  const rt = document.getElementById('ruler-ticks-el');
  if (rt) rt.style.display = 'block';
  document.getElementById('home-btn')?.classList.add('visible');
  document.querySelector('.main-area')?.classList.add('module-active');
}

/* ─── Module loading ─── */
async function loadModule(id) {
  const mod = getModule(id);
  if (!mod) return;

  // Cleanup old module
  if (activeModule?.cleanup) activeModule.cleanup();
  activeModule   = mod;
  activeModuleId = id;

  // Show module area, hide home
  _showModuleArea();

  // Update nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-module="${id}"]`)?.classList.add('active');

  // Update topbar (hidden but set anyway)
  document.getElementById('topbar-module').textContent = `${mod.label} · ${mod.desc}`;

  // Render
  const container = document.getElementById('mod-container');
  container.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:2rem">⟳ Loading…</div>`;

  await new Promise(r => setTimeout(r, 30));

  container.innerHTML = mod.render();
  mod.init();

  // Scroll to top
  document.getElementById('content-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });

  // Persist last-used module
  try { await Settings.set('lastModule', id); } catch(e) { console.warn('[Storage] lastModule save failed:', e); }
}

/* ─── Settings module renderer (inline, not in modules/registry) ─── */
function renderSettings() {
  const container = document.getElementById('mod-container');
  const installed = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;

  container.innerHTML = `
  <div class="settings-wrap">
    <div class="mod-header">
      <span class="mod-badge" style="color:var(--lime);background:var(--lime-dim);border-color:var(--lime-border)">APP · SETTINGS</span>
      <h2 class="mod-title" style="color:var(--lime)">Settings</h2>
      <p class="mod-desc">Manage your CalcHubApp installation, profile, and data.</p>
    </div>

    <!-- Profile -->
    <div class="settings-section">
      <div class="settings-section-title">Profile</div>
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="settings-avatar" title="Click to change photo">
          <span id="avatar-placeholder">👤</span>
        </div>
        <div>
          <input id="profile-name" type="text" class="field-input" value="${profileData.name}" placeholder="Your name" style="width:200px;margin-bottom:6px">
          <div style="font-size:11px;color:var(--text-muted)">Click avatar to upload a photo (shrinks automatically)</div>
          <input type="file" id="avatar-file" accept="image/*" style="display:none">
        </div>
      </div>
      <button class="calc-btn lime" style="max-width:200px" id="save-profile-btn">SAVE PROFILE</button>
    </div>

    <!-- Install -->
    <div class="settings-section">
      <div class="settings-section-title">PWA Install</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Install as App</div>
          <div class="settings-row-desc">Add CalcHubApp to your home screen for offline access. Works on Android Chrome, Edge, and desktop browsers.</div>
        </div>
        <button class="install-btn" id="install-btn" ${!deferredInstall && !installed ? 'disabled' : ''}>
          ${installed ? '✓ INSTALLED' : deferredInstall ? '⬇ INSTALL' : 'NOT AVAILABLE'}
        </button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Offline / SW Status</div>
          <div class="settings-row-desc">Service worker caches all modules for offline use.</div>
        </div>
        <span class="version-tag" id="sw-status">Checking…</span>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Persistent Storage</div>
          <div class="settings-row-desc">
            Prevents browser from clearing your data.<br>
            <span style="color:#f59e0b;font-size:10px;">
              🖥 Edge/Desktop: install the app first (⋯ → Apps → Install CalcHubApp)<br>
              📱 Android Chrome: add to Home Screen, then it grants automatically
            </span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
          <button class="calc-btn-sm green" id="persist-btn">Request Now</button>
          <span id="persist-status-tag" style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);">Checking…</span>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Storage Usage</div>
          <div class="settings-row-desc" id="storage-usage-desc">Calculating…</div>
        </div>
        <span class="version-tag" id="storage-usage-tag">—</span>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">App Version</div>
          <div class="settings-row-desc">CalcHubApp — Semantic versioning (MAJOR.MINOR.PATCH)</div>
        </div>
        <span class="version-tag">v${APP_VERSION}</span>
      </div>
    </div>

    <!-- Banner -->
    <div class="settings-section">
      <div class="settings-section-title">Banner Image</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Top Banner</div>
          <div class="settings-row-desc">Add any image — it shrinks vertically to fit the banner area. Supports portrait / landscape photos.</div>
        </div>
        <button class="calc-btn-sm" id="change-banner-settings">📷 Change</button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Remove Banner</div>
          <div class="settings-row-desc">Reset to the default CalcHub graphic.</div>
        </div>
        <button class="calc-btn-sm red" id="remove-banner-btn">Remove</button>
      </div>
    </div>

    <!-- Export / Import -->
    <div class="settings-section">
      <div class="settings-section-title">Export / Import Data</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Export All Data</div>
          <div class="settings-row-desc">Download all settings, history, and profile as a JSON backup file.</div>
        </div>
        <button class="calc-btn-sm orange" id="export-btn">⬇ Export</button>
      </div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Import Data</div>
          <div class="settings-row-desc">Restore from a previously exported CalcHubApp JSON backup.</div>
        </div>
        <button class="calc-btn-sm blue" id="import-btn">⬆ Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
    </div>

    <!-- Danger -->
    <div class="settings-section" style="border-color:rgba(248,113,113,.2)">
      <div class="settings-section-title" style="color:#f87171;border-left-color:#f87171">Danger Zone</div>
      <div class="settings-row">
        <div class="settings-row-info">
          <div class="settings-row-label">Clear All Data</div>
          <div class="settings-row-desc">Permanently removes all stored settings, history, and profile.</div>
        </div>
        <button class="calc-btn-sm red" id="clear-all-btn">🗑 Clear</button>
      </div>
    </div>
  </div>
  `;

  // Show SW status
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      const el = document.getElementById('sw-status');
      if (el) el.textContent = regs.length ? '✓ Active' : 'Pending';
    });
  }

  // Show persistent storage status using v3.0 API
  checkPersistence().then(p => {
    const btn = document.getElementById('persist-btn');
    if (btn) {
      btn.textContent  = p ? '✓ Granted' : 'Request Now';
      btn.style.color  = p ? 'var(--green)' : '';
      btn.disabled     = p;
    }
    const tag = document.getElementById('persist-status-tag');
    if (tag) {
      tag.textContent  = p ? 'Persistent ✓' : 'Not persistent';
      tag.style.color  = p ? 'var(--green)' : '#f87171';
    }
  });

  // Persist button click
  document.getElementById('persist-btn')?.addEventListener('click', async () => {
    const btn = document.getElementById('persist-btn');
    if (btn) { btn.textContent = 'Requesting…'; btn.disabled = true; }
    const granted = await requestPersistence();
    if (btn) {
      btn.textContent = granted ? '✓ Granted' : '✗ Denied';
      btn.style.color = granted ? 'var(--green)' : '#f87171';
      btn.disabled    = granted;
    }
    const tag = document.getElementById('persist-status-tag');
    if (tag) {
      tag.textContent = granted ? 'Persistent ✓' : 'Not persistent';
      tag.style.color = granted ? 'var(--green)' : '#f87171';
    }
    if (granted) {
      showToast('✓ Persistent storage granted — data is protected!');
    } else {
      showToast('⚠ Not granted. On Edge/Desktop: install the app first (⋯ → Apps → Install). On Android: add to Home Screen.', 6000);
    }
  });

  // Show storage usage
  getStorageEstimate().then(est => {
    const desc = document.getElementById('storage-usage-desc');
    const tag  = document.getElementById('storage-usage-tag');
    if (est) {
      if (desc) desc.textContent = `Using ${est.usedMB} MB of ${est.quotaMB} MB available (${est.pct}%)`;
      if (tag)  tag.textContent  = est.usedMB + ' MB';
    } else {
      if (desc) desc.textContent = 'Storage estimate not available in this browser';
      if (tag)  tag.textContent  = 'N/A';
    }
  });

  // Avatar display
  if (profileData.avatar) {
    const ph = document.getElementById('avatar-placeholder');
    if (ph) ph.innerHTML = `<img src="${profileData.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  }

  // Avatar upload
  const avatarDiv = document.getElementById('settings-avatar');
  const avatarFile = document.getElementById('avatar-file');
  avatarDiv?.addEventListener('click', () => avatarFile?.click());
  avatarFile?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    // Compress to max 300×300 JPEG before storing
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const MAX = 300;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

      // Update memory
      profileData.avatar = dataUrl;

      // AUTO-SAVE avatar to localStorage immediately
      try {
        localStorage.setItem('ch__profile_avatar', dataUrl);
        console.log('[Profile] Avatar auto-saved to localStorage ✓');
      } catch(e) {
        console.warn('[Profile] Avatar auto-save failed:', e.name);
      }

      // Update UI
      const ph = document.getElementById('avatar-placeholder');
      if (ph) ph.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      updateTopbarAvatar();
    };
    img.src = objectUrl;
  });

  // Save profile
  document.getElementById('save-profile-btn')?.addEventListener('click', async () => {
    profileData.name = document.getElementById('profile-name')?.value || 'User';
    await Profile.save(profileData);
    updateTopbarAvatar();
    // Update home greeting too
    const gn = document.getElementById('home-greeting-name');
    if (gn && profileData.name && profileData.name !== 'User') gn.textContent = `Hello, ${profileData.name} 👋`;
    showToast('✓ Profile saved');
  });

  // Install
  document.getElementById('install-btn')?.addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    const { outcome } = await deferredInstall.userChoice;
    if (outcome === 'accepted') { deferredInstall = null; showToast('✓ Installing…'); }
  });

  // Banner buttons
  document.getElementById('change-banner-settings')?.addEventListener('click', () => {
    document.getElementById('banner-file-input')?.click();
  });
  document.getElementById('remove-banner-btn')?.addEventListener('click', async () => {
    Banner.clear();
    renderBanner(null);
    showToast('Banner removed');
  });

  // Export
  document.getElementById('export-btn')?.addEventListener('click', async () => {
    const json = await exportAllData();
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), {
      href: url,
      download: `calchubapp-backup-${Date.now()}.json`
    });
    a.click();
    URL.revokeObjectURL(url);
    showToast('✓ Data exported');
  });

  // Import
  const importFile = document.getElementById('import-file');
  document.getElementById('import-btn')?.addEventListener('click', () => importFile?.click());
  importFile?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        await importAllData(ev.target.result);
        showToast('✓ Data imported — reload to apply');
      } catch {
        showToast('✗ Import failed — invalid file');
      }
    };
    reader.readAsText(file);
  });

  // Clear all
  document.getElementById('clear-all-btn')?.addEventListener('click', async () => {
    if (!confirm('Clear ALL CalcHubApp data? This cannot be undone.')) return;
    // Clear all ch__ prefixed localStorage keys (v3.0 format)
    const toRemove = Object.keys(localStorage).filter(k =>
      k.startsWith('ch__') || k.startsWith('ch_') || k.startsWith('idb_mirror')
    );
    toRemove.forEach(k => { try { localStorage.removeItem(k); } catch {} });
    // Delete IndexedDB
    try { indexedDB.deleteDatabase('CalcHubApp'); } catch {}
    showToast('✓ All data cleared — reloading…');
    setTimeout(() => location.reload(), 1500);
  });
}

/* ─── Banner handling ─── */
function renderBanner(dataUrl) {
  const section = document.getElementById('banner-section');
  if (!section) return;
  if (dataUrl) {
    section.innerHTML = `
      <div class="banner-wrap">
        <img class="banner-img" src="${dataUrl}" alt="Banner">
        <div class="banner-overlay"></div>
        <button class="banner-change-btn" id="banner-change-btn">📷 Change</button>
      </div>
      <input type="file" id="banner-file-input" accept="image/*" style="display:none">
    `;
  } else {
    const bannerSuggestions = [
      { label: '🌌 Space', url: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&q=80&auto=format' },
      { label: '🌄 Mountain', url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=80&auto=format' },
      { label: '🌊 Ocean', url: 'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1200&q=80&auto=format' },
      { label: '🌃 City', url: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200&q=80&auto=format' },
      { label: '🌿 Nature', url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80&auto=format' },
      { label: '🟩 Grid', url: '' },
    ];
    section.innerHTML = `
      <div class="banner-placeholder">
        <div class="banner-placeholder-text">CalcHub</div>
        <div style="position:absolute;bottom:10px;left:12px;display:flex;gap:6px;flex-wrap:wrap;">
          ${bannerSuggestions.filter(s=>s.url).map(s=>`<button onclick="__applyBanner('${s.url}')" style="background:rgba(12,11,9,.7);border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-family:var(--font-mono);font-size:10px;padding:4px 8px;cursor:pointer;backdrop-filter:blur(8px);">${s.label}</button>`).join('')}
        </div>
        <button class="banner-change-btn" id="banner-change-btn" style="position:absolute;bottom:10px;right:12px">📷 Upload</button>
      </div>
      <input type="file" id="banner-file-input" accept="image/*" style="display:none">
    `;
  }
  attachBannerEvents();
}

function attachBannerEvents() {
  document.getElementById('banner-change-btn')?.addEventListener('click', () => {
    document.getElementById('banner-file-input')?.click();
  });
  document.getElementById('banner-file-input')?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      const dataUrl = ev.target.result;
      Banner.save(dataUrl);
      renderBanner(dataUrl);
      showToast('✓ Banner updated');
    };
    reader.readAsDataURL(file);
  });
}

/* ─── Apply suggested banner ─── */
async function __applyBanner(url) {
  try {
    const resp = await fetch(url);
    const blob = await resp.blob();
    const reader = new FileReader();
    reader.onload = async (ev) => {
      Banner.save(ev.target.result);
      renderBanner(ev.target.result);
      showToast('✓ Banner applied');
    };
    reader.readAsDataURL(blob);
  } catch {
    showToast('✗ Could not load image (offline?)');
  }
}

/* ─── Toast ─── */
function showToast(msg, dur = 3000) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, dur);
}

/* ─── Sidebar toggle (mobile) ─── */
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const ov  = document.getElementById('sidebar-overlay');
  const open = sb.classList.toggle('open');
  ov.classList.toggle('show', open);
}

document.getElementById('hamburger')?.addEventListener('click', toggleSidebar);
document.getElementById('sidebar-overlay')?.addEventListener('click', toggleSidebar);

/* ─── Nav clicks ─── */
document.querySelectorAll('.nav-btn[data-module]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const id = btn.dataset.module;
    if (window.innerWidth <= 768) toggleSidebar();
    if (id === 'settings') {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('topbar-module').textContent = 'Settings';
      if (activeModule?.cleanup) activeModule.cleanup();
      activeModule = null;
      _showModuleArea();
      renderSettings();
    } else {
      await loadModule(id);
    }
  });
});

/* ─── Startup ─── */
async function startup() {
  // Open IDB first — don't block on persistence
  try {
    await openDB();
    console.log('[CalcHub] IndexedDB ready');
  } catch(e) {
    console.warn('[CalcHub] IndexedDB unavailable (private/incognito?), localStorage only:', e);
  }

  // Request persistence — non-blocking, retry silently
  // Edge desktop: granted only when PWA installed
  // Android Chrome: granted when added to Home Screen
  requestPersistence().then(granted => {
    console.log('[CalcHub] Persistent storage:', granted ? 'GRANTED ✓' : 'not granted (install PWA for protection)');
  }).catch(() => {});

  // Load profile — try IDB via Profile.load(), fallback to localStorage directly
  try {
    const saved = await Profile.load();
    if (saved) profileData = { ...profileData, ...saved };
  } catch(e) {
    console.warn('[Startup] Profile.load failed, reading LS directly:', e);
    // Direct localStorage fallback
    try {
      const metaRaw = localStorage.getItem('ch__profile_meta');
      if (metaRaw) Object.assign(profileData, JSON.parse(metaRaw));
    } catch {}
    const avatar = localStorage.getItem('ch__profile_avatar');
    if (avatar) profileData.avatar = avatar;
  }

  // Update topbar avatar
  updateTopbarAvatar();

  // Logo click → go home
  document.getElementById('logo-icon')?.addEventListener('click', showHomeScreen);

  // Topbar avatar click → go to settings
  document.getElementById('topbar-avatar')?.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-module="settings"]')?.classList.add('active');
    document.getElementById('topbar-module').textContent = 'Settings';
    if (activeModule?.cleanup) activeModule.cleanup();
    activeModule = null;
    renderSettings();
  });

  // Restore banner
  const bannerUrl = Banner.load();
  renderBanner(bannerUrl);

  // Build home grid
  buildHomeGrid();

  // Load last module or home screen
  const lastMod = await Settings.get('lastModule', '__home__');
  if (lastMod === '__home__' || !lastMod) {
    showHomeScreen();
  } else {
    await loadModule(lastMod);
  }

  // PWA pulse animation style
  const style = document.createElement('style');
  style.textContent = `
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:.4; }
    }
  `;
  document.head.appendChild(style);
}

startup().catch(console.error);
</script>
